<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self';">
  <title>Вход — CortenDesk Remote</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <form class="login-card" id="form">
    <h1>CortenDesk Remote</h1>
    <p class="muted" style="margin:4px 0 18px;">Удалённое управление рабочими столами</p>

    <div class="field">
      <label for="server">Сервер</label>
      <input type="text" id="server" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="username">Пользователь</label>
      <input type="text" id="username" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password">
    </div>

    <div class="check">
      <input type="checkbox" id="remember">
      <label for="remember" style="margin:0;">Запомнить вход на этом компьютере</label>
    </div>

    <p class="error" id="error" hidden></p>

    <button type="submit" id="submit">Войти</button>

    <p class="muted" id="status" style="margin:12px 0 0;"></p>
  </form>

  <script src="login.js"></script>
</body>
</html>
